name: Publish v1.8.3 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if ! gh release view v1.8.3 --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create v1.8.3 \
              --repo "$GH_REPO" \
              --target "$TARGET_SHA" \
              --title "FFXV COMRADES Save Editor v1.8.3" \
              --notes "Chocobo stats editor for existing registered Chocobos; editable level, caps, stamina, jump, top speed, skill level and injury; MAX ALL preset; no Add Chocobo function; Set Requirement preset removed; includes v1.7.0 reliability/UI fixes and verified weapon ability mapping."
          fi

          if [ -f .bootstrap/source.tar.xz ]; then
            cp .bootstrap/source.tar.xz FFXV_COMRADES_Save_Editor_v1.8.3_SOURCE.tar.xz
            sha256sum FFXV_COMRADES_Save_Editor_v1.8.3_SOURCE.tar.xz > FFXV_COMRADES_Save_Editor_v1.8.3_SOURCE.tar.xz.sha256.txt
            gh release upload v1.8.3 \
              FFXV_COMRADES_Save_Editor_v1.8.3_SOURCE.tar.xz \
              FFXV_COMRADES_Save_Editor_v1.8.3_SOURCE.tar.xz.sha256.txt \
              --repo "$GH_REPO" \
              --clobber
          fi
