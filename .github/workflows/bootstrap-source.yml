name: Publish source and release

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bootstrap payload
        id: check
        shell: bash
        run: |
          if [ -f .bootstrap/source.tar.xz ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Expand source
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          tar -xJf .bootstrap/source.tar.xz -C .

      - name: Generate runtime asset aliases
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p assets
          cp assets/comrades_header_1240_64.png assets/comrades_header_64.png
          cp assets/comrades_header_1240_90.png assets/comrades_header_90.png
          cp assets/comrades_header_1240_90.png assets/comrades_header.png
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open("assets/app_icon.png").convert("RGBA")
          im.save(
              "assets/app_icon.ico",
              format="ICO",
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          PY

      - name: Build ForgeCore.exe
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p Bundled
          cd core_source
          GOOS=windows GOARCH=amd64 go build -o ../Bundled/ForgeCore.exe .

      - name: Validate
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          python -m py_compile app.py forge_core.py FFXV_COMRADES_Save_Editor.pyw
          cd core_source
          go test ./...
          go vet ./...

      - name: Commit published source
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Publish FFXV COMRADES Save Editor v1.8.3 source"
            git push
          fi

      - name: Build release package
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          VERSION="1.8.3"
          PACKAGE="FFXV_COMRADES_Save_Editor_v${VERSION}_SOURCE.zip"
          rm -f "$PACKAGE" "$PACKAGE.sha256.txt"
          zip -r "$PACKAGE" .             -x '.git/*'             -x '.github/*'             -x "$PACKAGE"             -x "$PACKAGE.sha256.txt"
          sha256sum "$PACKAGE" > "$PACKAGE.sha256.txt"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.8.3"
          TARGET="$(git rev-parse HEAD)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$TARGET"               --title "FFXV COMRADES Save Editor v1.8.3"               --notes "FFXV COMRADES Save Editor v1.8.3

Adds verified editing for existing registered Chocobos, including level, level cap, limit max level, stamina, jump, top speed and injury. Includes MAX ALL. The Set Requirement preset is removed. This release does not add or register new Chocobos.

Also includes the v1.7.0 reliability and UI fixes, verified weapon ability slot mapping, signed resistance preservation, safer exports, and the bundled ForgeCore backend."
          fi
          gh release upload "$TAG" "$PACKAGE" "$PACKAGE.sha256.txt" --clobber
